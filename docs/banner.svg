  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <g opacity="0.18" fill="none" stroke="#fff" stroke-width="2">
    <rect x="860" y="48" width="260" height="46" rx="10"/>
    <rect x="900" y="112" width="220" height="46" rx="10"/>
