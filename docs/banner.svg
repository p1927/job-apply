  <text x="72" y="204" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#e2e8f0">Your AI job-search team. It finds, vets and applies.</text>
  <text x="72" y="244" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#93c5fd">Truthful resumes · a ledger of every job · follow-ups on autopilot · your data stays yours</text>
